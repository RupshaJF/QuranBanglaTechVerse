name: Build Android app

# Builds the Quran Bangla Android app: a Capacitor wrapper around the live website (https://quranbangla.vercel.app).
# The website itself is deployed by Vercel; the app shows the app-style UI from /app when it runs inside this wrapper.
# Everything that is added to the generated Android project lives in android-build/ (see docs/ANDROID_BUILD_BN.md).
#
#   * a push that changes this file or android-build/      -> debug APK
#   * Actions > "Build Android app" > Run workflow          -> debug, release (signed APK + AAB for Google Play) or both
#
# Repository secrets (Settings > Secrets and variables > Actions) - all optional for a debug build:
#   GOOGLE_SERVICES_JSON           Firebase google-services.json of the Android app (push notifications)
#   ANDROID_KEYSTORE_BASE64        release keystore, base64 encoded          \
#   ANDROID_KEYSTORE_PASSWORD      keystore password                          |  needed only for
#   ANDROID_KEY_ALIAS              key alias inside the keystore              |  release builds
#   ANDROID_KEY_PASSWORD           key password                              /
#   ANDROID_DEBUG_KEYSTORE_BASE64  optional: fixed debug key so debug APKs can update each other

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        type: choice
        options: [debug, release, both]
        default: debug
      version_name:
        description: 'Version name shown to users, e.g. 1.2.0 (empty = DEFAULT_VERSION_NAME below)'
        required: false
        default: ''
      version_code:
        description: 'Version code: a whole number that must grow with every Google Play upload (empty = automatic)'
        required: false
        default: ''
      publish_release:
        description: 'Attach the APK to a GitHub Release'
        type: boolean
        default: true
      release_notes:
        description: 'Release notes (optional)'
        required: false
        default: ''
  push:
    branches: ['**']
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android-build/**'

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Quran Bangla
  APP_ID: com.techverse.quranbangla
  LIVE_URL: https://quranbangla.vercel.app
  DEFAULT_VERSION_NAME: '1.1.081848'    # shown to users - change it when you publish a new version
  VERSION_CODE_BASE: '100'         # automatic versionCode = this + run number (always grows, Google Play needs that)
  QR_PROJECT_DIR: /tmp/app

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/build-apk.yml', 'android-build/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Settings for this run
        env:
          IN_BUILD_TYPE: ${{ inputs.build_type }}
          IN_VERSION_NAME: ${{ inputs.version_name }}
          IN_VERSION_CODE: ${{ inputs.version_code }}
          IN_PUBLISH: ${{ inputs.publish_release }}
          IN_NOTES: ${{ inputs.release_notes }}
        run: |
          BUILD_TYPE="${IN_BUILD_TYPE:-debug}"
          case "$BUILD_TYPE" in debug | release | both) ;; *) echo "::error::build_type must be debug, release or both"; exit 1 ;; esac
          VERSION_NAME="${IN_VERSION_NAME:-$DEFAULT_VERSION_NAME}"
          VERSION_CODE="${IN_VERSION_CODE:-$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::version_name may only contain letters, digits and . _ + - (got: $VERSION_NAME)"; exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::version_code must be a whole number between 1 and 2100000000 (got: $VERSION_CODE)"; exit 1
          fi
          {
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "APP_VERSION=$VERSION_NAME"
            echo "APP_VERSION_CODE=$VERSION_CODE"
            echo "PUBLISH_RELEASE=${IN_PUBLISH:-true}"
            echo "DO_DEBUG=$([ "$BUILD_TYPE" != release ] && echo true || echo false)"
            echo "DO_RELEASE=$([ "$BUILD_TYPE" != debug ] && echo true || echo false)"
            echo "FILE_STEM=${APP_NAME// /}-${VERSION_NAME}-${VERSION_CODE}"
          } >> "$GITHUB_ENV"
          printf '%s' "$IN_NOTES" > "$RUNNER_TEMP/release-notes-input.txt"
          mkdir -p "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/reports"
          echo "Building: $BUILD_TYPE, version $VERSION_NAME ($VERSION_CODE)"

      - name: Check the build scripts (self-test)
        run: node android-build/self-test.mjs

      - name: Check the repository (preflight)
        env:
          QR_BUILD_RELEASE: ${{ env.DO_RELEASE }}
        run: node android-build/preflight.mjs

      - name: Create the Android project
        id: create_full
        continue-on-error: true
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash android-build/create-project.sh full

      - name: Debug signing key (optional)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the debug key from the ANDROID_DEBUG_KEYSTORE_BASE64 secret: new debug APKs can be installed over old ones."
          else
            echo "No ANDROID_DEBUG_KEYSTORE_BASE64 secret: a new debug key is generated on every run, so uninstall the old debug app before installing a new debug APK."
          fi

      - name: Build debug APK
        id: debug_full
        if: env.DO_DEBUG == 'true' && steps.create_full.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-debug-full.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/${FILE_STEM}-debug.apk"

      - name: Build signed release APK and AAB
        id: release
        if: env.DO_RELEASE == 'true' && steps.create_full.outcome == 'success' && steps.debug_full.outcome != 'failure'
        working-directory: /tmp/app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::A release build needs these repository secrets:$missing (Settings > Secrets and variables > Actions). How to create them: docs/ANDROID_BUILD_BN.md"
            exit 1
          fi
          KS="$RUNNER_TEMP/qr-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          export QR_KEYSTORE_PATH="$KS" QR_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" QR_KEY_ALIAS="$ANDROID_KEY_ALIAS" QR_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if ! keytool -list -keystore "$KS" -storepass:env QR_KEYSTORE_PASSWORD -alias "$QR_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with this password / key alias. Check the secrets ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/${FILE_STEM}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/${FILE_STEM}-release.aab"

      - name: Build debug APK in safe mode (fallback)
        id: debug_safe
        if: env.DO_DEBUG == 'true' && (steps.create_full.outcome == 'failure' || steps.debug_full.outcome == 'failure')
        env:
          GOOGLE_SERVICES_JSON: ''
        run: |
          echo "::warning::The normal debug build failed. A reduced safe-mode APK is built so that something installable exists - this run is still reported as failed."
          bash android-build/create-project.sh safe
          cd /tmp/app/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-debug-safe.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/${FILE_STEM}-debug-SAFE-MODE.apk"

      - name: Check what is inside the APKs
        id: audit
        run: |
          shopt -s nullglob
          files=(dist/*.apk)
          if [ ${#files[@]} -eq 0 ]; then echo "No APK was built."; exit 0; fi
          (cd dist && sha256sum *.apk *.aab 2>/dev/null > SHA256SUMS.txt) || true
          for apk in "${files[@]}"; do
            kind=debug; strict=()
            case "$apk" in *-release.apk) kind=release; strict=(--strict) ;; esac
            mode=full; case "$apk" in *SAFE-MODE*) mode=safe ;; esac
            node android-build/audit-apk.mjs --apk "$apk" --app-id "$APP_ID" --version-name "$APP_VERSION" --version-code "$APP_VERSION_CODE" \
              --kind "$kind" --mode "$mode" "${strict[@]}" \
              --summary "reports/audit-$(basename "$apk").md" --assetlinks "reports/assetlinks-$kind.json" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Next steps for App Links (release only)
        if: hashFiles('reports/assetlinks-release.json') != ''
        run: |
          {
            echo '### Verified App Links (optional)'
            echo
            echo 'To let links to the website open in the app, publish this file at `https://quranbangla.vercel.app/.well-known/assetlinks.json`'
            echo '(commit it as `.well-known/assetlinks.json`). If the app is installed from Google Play with Play App Signing, add the SHA-256 fingerprint shown in'
            echo 'Play Console > Setup > App signing as a second entry in `sha256_cert_fingerprints`.'
            echo
            echo '```json'
            cat reports/assetlinks-release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: always() && hashFiles('dist/*-debug*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: QuranBangla-debug-apk
          path: dist/*-debug*.apk
          if-no-files-found: ignore

      - name: Upload release APK and AAB
        if: always() && (hashFiles('dist/*-release.apk') != '' || hashFiles('dist/*.aab') != '')
        uses: actions/upload-artifact@v4
        with:
          name: QuranBangla-release
          path: |
            dist/*-release.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          if-no-files-found: ignore

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            reports/
            /tmp/app/qr-patch-report.*.json
            ${{ runner.temp }}/gradle-*.log
          if-no-files-found: ignore

      - name: Publish the debug APK to Releases
        if: env.PUBLISH_RELEASE == 'true' && hashFiles('dist/*-debug*.apk') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          apk=(dist/*-debug*.apk)
          title="$APP_NAME #${GITHUB_RUN_NUMBER} (debug $APP_VERSION)"
          note="Debug APK for testing - not for Google Play. Version $APP_VERSION ($APP_VERSION_CODE), commit ${GITHUB_SHA::7}."
          case "${apk[0]}" in *SAFE-MODE*) title="$title SAFE MODE"; note="SAFE MODE: reduced build produced because the full build failed. $note" ;; esac
          { cat "$RUNNER_TEMP/release-notes-input.txt"; echo; echo "$note"; } > "$RUNNER_TEMP/release-notes.md"
          gh release create "build-${GITHUB_RUN_NUMBER}" "${apk[0]}" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease

      - name: Publish the signed release APK to Releases
        if: env.PUBLISH_RELEASE == 'true' && hashFiles('dist/*-release.apk') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          apk=(dist/*-release.apk)
          note="Signed release build. Version $APP_VERSION ($APP_VERSION_CODE), commit ${GITHUB_SHA::7}. The .aab for Google Play is in the workflow artifacts (QuranBangla-release)."
          { cat "$RUNNER_TEMP/release-notes-input.txt"; echo; echo "$note"; } > "$RUNNER_TEMP/release-notes.md"
          gh release create "v${APP_VERSION}-${APP_VERSION_CODE}" "${apk[0]}" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$APP_NAME $APP_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove the signing keys from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/qr-release.keystore" "$HOME/.android/debug.keystore" || true

      - name: Mark the run as failed when the full build failed
        if: always() && (steps.create_full.outcome == 'failure' || steps.debug_full.outcome == 'failure')
        run: |
          {
            echo '### The full build failed'
            echo
            echo 'See the red step above. A reduced "SAFE-MODE" debug APK was built as a fallback where possible (artifact `QuranBangla-debug-apk`).'
            echo
            echo 'Last lines of the Gradle log:'
            echo '```'
            tail -n 60 "$RUNNER_TEMP/gradle-debug-full.log" 2>/dev/null || echo '(no Gradle log: the failure happened while creating the project)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The full build failed. Details are in the step summary and in the 'build-reports' artifact."
          exit 1
